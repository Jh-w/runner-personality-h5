<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="105" r="78" fill="#FF6B35" opacity="0.07"/>
  <!-- 蹲踞起跑姿态 -->
  <!-- 左腿（跪姿） -->
  <line x1="70" y1="145" x2="50" y2="170" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="170" r="6" fill="#E65100"/>
  <!-- 右腿（蹬地） -->
  <line x1="95" y1="140" x2="115" y2="175" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
  <circle cx="115" cy="175" r="6" fill="#E65100"/>
  <!-- 身体前倾 -->
  <rect x="65" y="95" width="34" height="48" rx="12" fill="#FF6B35" transform="rotate(-15, 82, 119)"/>
  <!-- 左臂撑地 -->
  <line x1="68" y1="100" x2="35" y2="145" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/>
  <!-- 右臂后摆预备 -->
  <line x1="98" y1="100" x2="128" y2="78" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="98" cy="80" r="18" fill="#FFAB91"/>
  <!-- 发带 -->
  <rect x="80" y="66" width="36" height="8" rx="4" fill="#E65100"/>
  <!-- 碳板跑鞋特写 -->
  <rect x="36" y="165" width="28" height="10" rx="4" fill="#FF9800"/>
  <rect x="38" y="162" width="24" height="6" rx="2" fill="#FFCC80"/>
  <!-- 鞋底碳板 -->
  <line x1="38" y1="173" x2="62" y2="173" stroke="#333" stroke-width="2"/>
  <!-- 起点线 -->
  <line x1="25" y1="178" x2="175" y2="178" stroke="#FF6B35" stroke-width="3" opacity="0.3" stroke-dasharray="4,3"/>
</svg>