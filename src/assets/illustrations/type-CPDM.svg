<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#F44336" opacity="0.06"/>
  <!-- 左腿 -->
  <line x1="80" y1="130" x2="55" y2="160" stroke="#F44336" stroke-width="7" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="95" y1="130" x2="110" y2="162" stroke="#F44336" stroke-width="7" stroke-linecap="round"/>
  <!-- 身体轻松直立 -->
  <rect x="70" y="80" width="34" height="50" rx="12" fill="#F44336"/>
  <!-- 左臂（口袋插） -->
  <line x1="70" y1="95" x2="50" y2="115" stroke="#F44336" stroke-width="7" stroke-linecap="round"/>
  <!-- 右臂随意摆 -->
  <line x1="104" y1="88" x2="130" y2="70" stroke="#F44336" stroke-width="7" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="92" cy="65" r="19" fill="#EF9A9A"/>
  <!-- 墨镜 -->
  <rect x="74" y="58" width="36" height="12" rx="6" fill="#212121"/>
  <rect x="76" y="60" width="14" height="8" rx="3" fill="#424242"/>
  <rect x="94" y="60" width="14" height="8" rx="3" fill="#424242"/>
  <line x1="74" y1="64" x2="110" y2="64" stroke="#616161" stroke-width="1"/>
  <!-- 耳机 -->
  <rect x="108" y="60" width="8" height="14" rx="4" fill="#333"/>
  <rect x="68" y="60" width="8" height="14" rx="4" fill="#333"/>
  <path d="M68,62 Q78,50 92,50 Q106,50 116,62" fill="none" stroke="#333" stroke-width="3"/>
  <!-- 笑容 -->
  <path d="M86,74 Q92,79 98,74" fill="none" stroke="#F44336" stroke-width="1.5" stroke-linecap="round"/>
</svg>