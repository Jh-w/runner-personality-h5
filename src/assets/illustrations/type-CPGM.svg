<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#FF9800" opacity="0.06"/>
  <!-- 慢跑姿态 - 腿幅度小 -->
  <!-- 左腿 -->
  <line x1="80" y1="130" x2="65" y2="158" stroke="#FF9800" stroke-width="7" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="95" y1="130" x2="105" y2="158" stroke="#FF9800" stroke-width="7" stroke-linecap="round"/>
  <!-- 身体微倾 -->
  <rect x="72" y="82" width="32" height="48" rx="10" fill="#FF9800"/>
  <!-- 左臂自然摆 -->
  <line x1="72" y1="90" x2="52" y2="108" stroke="#FF9800" stroke-width="7" stroke-linecap="round"/>
  <!-- 右臂摆 -->
  <line x1="104" y1="90" x2="126" y2="75" stroke="#FF9800" stroke-width="7" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="92" cy="66" r="18" fill="#FFCC80"/>
  <!-- 遮阳帽 -->
  <path d="M74,58 Q80,46 92,45 Q104,46 110,58" fill="#FF9800"/>
  <rect x="70" y="54" width="44" height="5" rx="2" fill="#E65100"/>
  <!-- 水壶腰包 -->
  <rect x="70" y="118" width="36" height="12" rx="6" fill="#5D4037"/>
  <rect x="74" y="121" width="8" height="10" rx="3" fill="#42A5F5"/>
  <rect x="86" y="121" width="8" height="10" rx="3" fill="#42A5F5"/>
  <rect x="98" y="121" width="4" height="8" rx="2" fill="#8D6E63"/>
  <!-- 悠闲表情 -->
  <path d="M82,63 L86,63" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
  <path d="M98,63 L102,63" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
  <path d="M86,72 Q92,77 98,72" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
</svg>