<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#607D8B" opacity="0.07"/>
  <!-- 风线 -->
  <line x1="155" y1="50" x2="180" y2="45" stroke="#607D8B" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="158" y1="65" x2="185" y2="62" stroke="#607D8B" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="155" y1="78" x2="178" y2="77" stroke="#607D8B" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- 左腿 -->
  <line x1="82" y1="128" x2="62" y2="165" stroke="#546E7A" stroke-width="7" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="95" y1="128" x2="112" y2="165" stroke="#546E7A" stroke-width="7" stroke-linecap="round"/>
  <!-- 身体 -->
  <rect x="72" y="82" width="30" height="46" rx="10" fill="#607D8B"/>
