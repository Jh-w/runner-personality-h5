<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#E040FB" opacity="0.06"/>
  <!-- 时尚跑姿 -->
  <!-- 左腿（大步幅） -->
  <line x1="78" y1="130" x2="48" y2="158" stroke="#E040FB" stroke-width="7" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="95" y1="128" x2="115" y2="160" stroke="#E040FB" stroke-width="7" stroke-linecap="round"/>
  <!-- 身体 -->
  <rect x="70" y="80" width="32" height="50" rx="11" fill="#9C27B0"/>
  <!-- 荧光条纹 -->
  <rect x="70" y="110" width="32" height="6" rx="2" fill="#E040FB"/>
  <!-- 左臂 -->
  <line x1="70" y1="88" x2="44" y2="72" stroke="#9C27B0" stroke-width="7" stroke-linecap="round"/>
  <!-- 右臂 -->
  <line x1="102" y1="88" x2="132" y2="62" stroke="#9C27B0" stroke-width="7" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="92" cy="65" r="18" fill="#CE93D8"/>
  <!-- 时尚发型/刘海 -->
  <path d="M76,58 Q78,46 92,48 Q106,46 108,58 Q104,52 92,53 Q80,52 76,58" fill="#7B1FA2"/>
  <!-- 发光耳环 -->
  <circle cx="110" cy="65" r="3" fill="#E040FB"/>
  <circle cx="110" cy="65" r="6" fill="#E040FB" opacity="0.2"/>
  <!-- 亮色运动手表 -->
  <rect x="38" y="68" width="10" height="12" rx="3" fill="#E040FB"/>
  <rect x="40" y="70" width="6" height="4" rx="1" fill="#212121"/>
  <!-- 发光元素 -->
  <circle cx="132" cy="62" r="5" fill="#E040FB" opacity="0.3"/>
  <circle cx="132" cy="62" r="2.5" fill="#E040FB" opacity="0.5"/>
  <!-- 运动鞋发光底 -->
  <ellipse cx="46" cy="162" rx="10" ry="4" fill="#E040FB" opacity="0.7"/>
  <ellipse cx="117" cy="162" rx="10" ry="4" fill="#E040FB" opacity="0.7"/>
  <!-- 酷表情 -->
  <circle cx="86" cy="64" r="2.5" fill="#4A148C"/>
  <circle cx="98" cy="64" r="2.5" fill="#4A148C"/>
  <path d="M86,73 Q92,69 98,73" fill="none" stroke="#4A148C" stroke-width="1.5" stroke-linecap="round"/>
</svg>