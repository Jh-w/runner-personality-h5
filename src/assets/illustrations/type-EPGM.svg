<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="78" fill="#9C27B0" opacity="0.05"/>
  <!-- 悠闲漫步姿态 -->
  <!-- 左腿（慢走） -->
  <line x1="78" y1="130" x2="65" y2="158" stroke="#9C27B0" stroke-width="6" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="95" y1="130" x2="100" y2="158" stroke="#9C27B0" stroke-width="6" stroke-linecap="round"/>
  <!-- 身体略后倾（放松） -->
  <rect x="72" y="80" width="32" height="50" rx="10" fill="#9C27B0"/>
  <!-- 左臂（自然下垂） -->
  <line x1="72" y1="88" x2="58" y2="115" stroke="#9C27B0" stroke-width="6" stroke-linecap="round"/>
  <!-- 右臂（拿冰棍） -->
  <line x1="104" y1="88" x2="128" y2="68" stroke="#9C27B0" stroke-width="6" stroke-linecap="round"/>
  <!-- 冰棍 -->
  <rect x="126" y="56" width="10" height="16" rx="2" fill="#FF6D00"/>
  <rect x="128" y="58" width="6" height="6" rx="1" fill="#FFAB40"/>
  <line x1="131" y1="72" x2="131" y2="80" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 头部 -->
  <circle cx="92" cy="64" r="18" fill="#CE93D8"/>
  <!-- 太阳帽 -->
  <ellipse cx="92" cy="50" rx="28" ry="8" fill="#E1BEE7"/>
  <path d="M74,50 Q80,40 92,40 Q104,40 110,50" fill="#9C27B0"/>
  <!-- 太阳镜 -->
  <rect x="76" y="58" width="32" height="10" rx="5" fill="#4A148C"/>
  <rect x="78" y="60" width="12" height="6" rx="2" fill="#7B1FA2"/>
  <rect x="94" y="60" width="12" height="6" rx="2" fill="#7B1FA2"/>
  <!-- 微笑 -->
  <path d="M86,75 Q92,80 98,75" fill="none" stroke="#4A148C" stroke-width="2" stroke-linecap="round"/>
  <!-- 小太阳/光点 -->
  <circle cx="160" cy="30" r="10" fill="#FFC107" opacity="0.2"/>
  <circle cx="160" cy="30" r="5" fill="#FFC107" opacity="0.3"/>
  <line x1="150" y1="30" x2="145" y2="30" stroke="#FFC107" stroke-width="2" opacity="0.3"/>
  <line x1="170" y1="30" x2="175" y2="30" stroke="#FFC107" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="20" x2="160" y2="15" stroke="#FFC107" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="40" x2="160" y2="45" stroke="#FFC107" stroke-width="2" opacity="0.3"/>
</svg>